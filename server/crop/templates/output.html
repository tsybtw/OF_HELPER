
<!DOCTYPE html>
<html>
<head>
    <title>OF HELPER by @yen_ofsfs</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/HBhjTHT.png">
    <style>
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-size: 2em;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            position: relative;
            max-width: 80vw;
        }
        .logo {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 16px;
            overflow: visible;
            aspect-ratio: 1/1;
        }
        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
        }
        .candle-glow {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: radial-gradient(
                circle at 30% 40%,
                rgba(255, 147, 41, 0.3) 0%,
                rgba(255, 147, 41, 0.2) 20%,
                rgba(255, 147, 41, 0.1) 40%,
                rgba(255, 147, 41, 0.05) 60%,
                transparent 70%
            );
            filter: blur(30px);
            animation: flicker 4s infinite alternate;
            z-index: 1;
        }
        .glow-overlay {
            position: absolute;
            top: 50%;
            left: 20%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 110%;
            background: radial-gradient(
                circle at center,
                rgba(255, 183, 77, 0.6) 0%,
                rgba(255, 183, 77, 0.3) 30%,
                rgba(255, 183, 77, 0.1) 60%,
                transparent 80%
            );
            filter: blur(20px);
            animation: flicker 4s infinite alternate;
            z-index: 3;
            mix-blend-mode: screen;
        }
        @keyframes flicker {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
            25%, 75% {
                opacity: 0.8;
            }
            35%, 65% {
                opacity: 0.9;
            }
        }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle at center,
                transparent 0%,
                rgba(0, 0, 0, 0.8) 100%
            );
            pointer-events: none;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    <div class="container">
        <div class="logo">
            <div class="candle-glow"></div>
            <img src="https://i.imgur.com/A2orTGN.gif" alt="Animation">
            <div class="glow-overlay"></div>
        </div>
    </div>
</body>
</html>
